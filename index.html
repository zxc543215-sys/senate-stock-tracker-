<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球市場與官員持股監控</title>
    <!-- 引入 TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #131722; color: #d1d4dc; margin: 0; padding: 20px; }
        .header { display: flex; gap: 10px; margin-bottom: 20px; }
        select, button { padding: 8px 16px; background: #2a2e39; color: white; border: 1px solid #434651; border-radius: 4px; cursor: pointer; }
        select:focus, button:focus { outline: none; border-color: #2962ff; }
        #chart-container { width: 100%; height: 600px; border: 1px solid #2a2e39; border-radius: 4px; overflow: hidden; }
        .loading { display: none; color: #2962ff; margin-left: 10px; }
    </style>
</head>
<body>

    <h2>市場監控與籌碼追蹤</h2>
    <div class="header">
        <select id="ticker-select">
            <option value="AAPL">Apple (AAPL)</option>
            <option value="MSFT">Microsoft (MSFT)</option>
            <option value="NVDA">NVIDIA (NVDA)</option>
            <option value="XAUUSD=X">黃金 (XAUUSD)</option>
        </select>
        <button onclick="loadData()">載入圖表與籌碼</button>
        <span id="loading-indicator" class="loading">資料載入中...</span>
    </div>

    <div id="chart-container"></div>

    <script>
        // 初始化 TradingView 圖表
        const chartProperties = {
            layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: 'rgba(42, 46, 57, 0.5)' }, horzLines: { color: 'rgba(42, 46, 57, 0.5)' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#2a2e39' },
            timeScale: { borderColor: '#2a2e39', timeVisible: true }
        };
        
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), chartProperties);
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        async function loadData() {
            const ticker = document.getElementById('ticker-select').value;
            const loading = document.getElementById('loading-indicator');
            loading.style.display = 'inline';

            try {
                // 1. 抓取 K 線報價
                const marketRes = await fetch(`http://127.0.0.1:8000/api/market/${ticker}`);
                const marketJson = await marketRes.json();
                if(marketJson.status === 'success') {
                    candleSeries.setData(marketJson.data);
                }

                // 2. 抓取議員交易紀錄 (Markers)
                // 由於開源資料庫以美股代碼為主，黃金這類匯率/期貨標記會是空的，但圖表仍會正常顯示
                const cleanTicker = ticker.split('=')[0]; 
                const tradesRes = await fetch(`http://127.0.0.1:8000/api/trades/${cleanTicker}`);
                const tradesJson = await tradesRes.json();
                if(tradesJson.status === 'success') {
                    // 去除日期重複的 marker，避免圖表渲染錯誤 (簡化處理)
                    const uniqueMarkers = [];
                    const seenDates = new Set();
                    tradesJson.data.forEach(marker => {
                        if(!seenDates.has(marker.time)) {
                            seenDates.add(marker.time);
                            uniqueMarkers.push(marker);
                        }
                    });
                    candleSeries.setMarkers(uniqueMarkers);
                }
                
                chart.timeScale().fitContent();
            } catch (error) {
                console.error("載入失敗:", error);
                alert("資料載入失敗，請確認後端 API 是否已啟動。");
            } finally {
                loading.style.display = 'none';
            }
        }

        // 預設載入
        loadData();
    </script>
</body>
</html>
